name: Validate PowerShell

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse scripts and validate fixtures
        shell: powershell
        run: .\tests\StaticValidation.ps1
